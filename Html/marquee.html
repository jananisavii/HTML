<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marquee Tag</title>

</head>
<body>
    <h1>Marquee Tag in html</h1>
    <marquee behavior="" direction="right">
        <h1> How are you</h1>
    </marquee>
    <marquee behavior=""  loop = "4" direction="left" scroll amount = "28">   //  behavior = "slide or scroll or alternate", your wish for loop is how many times come and move
    <p> Breaking News : Sundar pichai became a billionare after 18 years as Alphabet CEO </p>
    </marquee>
    <marquee behavior="" direction="right" speed amount = "40">
        <img src="https://i.pinimg.com/originals/c5/7f/5a/c57f5af94487bb62711c5adf7926feb2.gif" alt=""> // image tag which element (inline block level element)
    </marquee>

</body>
</html>
