<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
<h1> Student Form</h1>
<form action=""></form>

<form action="" autocomplete="off" method="post or get">
 
    <fieldset>
   
        <legend> Student Information</legend>

        <label for="sn"> Student Name</label>
        <input type="text" name = "stuname" placeholder = "enter name" id = "sn" required> <br> <br>  
        
      
        <label for="ph">Phone Number</label>
        <input type=""" name = "stuph" placeholder = "enter phone number"  id = " ph" required minlength="10"> <br> <br>
        
        <label for="pass">Password</label>
        <input type="password" name = "username" placeholder = "enter password" id = "pas" required minlength="6"> <br> <br>

        <label for=" age"> Student Age </label>
        <input type="number" placeholder = "enter age " id = "ag" ><br> <br>

        <label for="se"> Student Email</label>    
        <input type="email" placeholder = "enter email" id = "ema" value="Student@gmail.com" readonly> <br> <br>


        <label for=""> Subject</label> <br> <br>

        <input type="checkbox" name ="sub1" id = "s1" value = "HTML"> 
        <label for="s1"> HTML</label>
         
        <input type="checkbox" name = "sub2" id = " s2" value = "JS" > 
        <label for="s2"> JS</label>

        <input type="checkbox" name = "sub3" id = "s3" value = "CSS"> 
        <label for="s3"> CSS</label> <br> <br>

        <label for=""> select your gender</label> <br> <br>

        <label for="M">Male</label>
        <input type="radio" name = " gender" id = "M" value = "male"> 

        <label for="F">Female</label>
        <input type="radio" name="gender" id="F" value = " female">

        <label for="O">Other</label>
        <input type="radio" name="gender" id="O" value = "Other"> <br> <br>

        <label for=""> Date of Birth</label>
        <input type="date" name="dob" id="DOB"> <br><br>

        <label for="">Address</label> <br> <br>
         <textarea name="adderss" id="adrs"  placeholder = " enter addresss"  rows = "10" cols = "50"></textarea> <br> <br>

         <label for="">select the course</label> <br> 

         <select name="course" id="">       
            <option value=""></option>
            <option value="java"> java full stack</option>
            <option value="python"> python full stack</option>
            <option value="mern"> mern stack</option>
         </select> <br> <br>


         <label for=""> expected salary</label>
         <input type ="range" name="salary" id="" min ="10000" max = "50000"> <br> <br>

         


        <button>Submit</button> <br>
        <button type  = "submit">submit</button> <br>
        <button type = "reset"> reset</button>  <br>
        <button type = "submit" value = "submit by input"></button> <br>
        <input type="reset" value = "reset by input"> <br>




    </fieldset>
      





</form>

    
</body>
</html>
